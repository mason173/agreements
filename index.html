<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>法律协议与清单</title>
    <style>
      body {
        margin: 0;
        padding:
          calc(32px + env(safe-area-inset-top))
          calc(20px + env(safe-area-inset-right))
          calc(48px + env(safe-area-inset-bottom))
          calc(20px + env(safe-area-inset-left));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: #1f2937;
        background: #f7f8fa;
        -webkit-text-size-adjust: 100%;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 28px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.3;
      }

      h2 {
        margin: 32px 0 4px;
        font-size: 17px;
        line-height: 1.4;
      }

      p {
        margin: 0 0 20px;
        color: #6b7280;
        line-height: 1.7;
      }

      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li + li {
        border-top: 1px solid #edf0f3;
      }

      a {
        display: block;
        padding: 14px 0;
        color: #0a59f7;
        text-decoration: none;
        font-size: 16px;
        line-height: 1.5;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: rgba(255, 255, 255, 0.9);
          background: #000;
        }

        main {
          background: #111318;
          border-color: rgba(255, 255, 255, 0.14);
        }

        p {
          color: rgba(255, 255, 255, 0.62);
        }

        li + li {
          border-top-color: rgba(255, 255, 255, 0.12);
        }

        a {
          color: #5291ff;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>法律协议与清单</h1>
      <p>请选择需要查看的协议或说明文件。</p>

      <h2>松果清单 · Pinecone List</h2>
      <ul>
        <li><a href="./pinecone/user-service-agreement.html">松果清单用户服务协议</a></li>
        <li><a href="./pinecone/privacy-statement.html">松果清单隐私声明</a></li>
      </ul>
    </main>
  </body>
</html>
